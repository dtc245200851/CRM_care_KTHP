name: crm-care

networks:
  crm-network:
    driver: bridge

volumes:
  postgres_data:
    name: crm_postgres_data
  pgadmin_data:
    name: crm_pgadmin_data
  nginx_logs:
    name: crm_nginx_logs
  backend_logs:
    name: crm_backend_logs
  prometheus_data:
    name: crm_prometheus_data
  grafana_data:
    name: crm_grafana_data
  loki_data:
    name: crm_loki_data

services:
  # ─── 1. PostgreSQL Database ────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: crm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crm_care}
      POSTGRES_USER: ${POSTGRES_USER:-crm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CrmCare@SecureP@ss2024!}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - crm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crm_user} -d ${POSTGRES_DB:-crm_care}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── 2. pgAdmin 4 Management Interface ─────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:8.5
    container_name: crm_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@crmcare.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-PgAdm1n@SecureP@ss2024!}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5051:80"
    networks:
      - crm-network
    depends_on:
      postgres:
        condition: service_healthy

  # ─── 3. CRM Backend API (Node.js + Express + Prisma) ───────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm_backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-5000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://crm_user:CrmCare@SecureP@ss2024!@postgres:5432/crm_care?schema=public}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production-min-32-chars}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - backend_logs:/app/logs
    ports:
      - "5000:5000"
    networks:
      - crm-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  # ─── 4. CRM Frontend SPA (React + Vite + Tailwind) ─────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crm_frontend
    restart: unless-stopped
    networks:
      - crm-network
    depends_on:
      backend:
        condition: service_healthy

  # ─── 5. Nginx Reverse Proxy (Cổng vào duy nhất) ─────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: crm_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_logs:/var/log/nginx
    networks:
      - crm-network
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/nginx_status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─── 6. Prometheus Monitoring Server ───────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: crm_prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9091:9090"
    networks:
      - crm-network
    depends_on:
      - backend

  # ─── 7. Grafana Dashboard & Visualization ──────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: crm_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-Gr@fana@SecureP@ss2024!}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/var/lib/grafana/dashboards/crm-overview.json"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - crm-network
    depends_on:
      - prometheus

  # ─── 8. PostgreSQL Prometheus Exporter ─────────────────────────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: crm_postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: ${DATA_SOURCE_NAME:-postgresql://crm_user:CrmCare@SecureP@ss2024!@postgres:5432/crm_care?sslmode=disable}
    networks:
      - crm-network
    depends_on:
      postgres:
        condition: service_healthy

  # ─── 9. Nginx Prometheus Exporter ──────────────────────────────────────────
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: crm_nginx_exporter
    restart: unless-stopped
    command:
      - -nginx.scrape-uri=http://nginx:80/nginx_status
    networks:
      - crm-network
    depends_on:
      - nginx

  # ─── 10. Node Exporter (Host System Metrics) ───────────────────────────────
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: crm_node_exporter
    restart: unless-stopped
    networks:
      - crm-network

  # ─── 11. Loki Log Aggregator ───────────────────────────────────────────────
  loki:
    image: grafana/loki:3.0.0
    container_name: crm_loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./logging/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3101:3100"
    networks:
      - crm-network

  # ─── 12. Promtail Log Shipper ──────────────────────────────────────────────
  promtail:
    image: grafana/promtail:3.0.0
    container_name: crm_promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./logging/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - nginx_logs:/var/log/nginx:ro
      - backend_logs:/var/log/backend:ro
    networks:
      - crm-network
    depends_on:
      - loki
